x-env: &env
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: appdb
  MYSQL_URL: mysql+pymysql://app:app@mysql:3306/appdb
  APP_URL: http://app:8000

services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40

  app:
    build: .
    environment:
      <<: *env
      ENABLE_FAULT_INJECTION: "1"  # demo scaffolding, not part of the migration: lets `fault <rate>` break shadow writes on purpose
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-off commands: docker compose run --rm tools <command>
  tools:
    build: .
    profiles: ["tools"]
    environment: *env
    entrypoint: ["python", "-m", "migrator"]
    depends_on:
      app:
        condition: service_healthy
